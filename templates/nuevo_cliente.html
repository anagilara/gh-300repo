{% extends "base.html" %}

{% block title %}Nuevo Cliente - Administrador{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h1>➕ Crear Nuevo Cliente</h1>

        <form method="POST" class="mt-4" novalidate>
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre del Cliente *</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required>
                <small class="form-text text-muted">Campo obligatorio</small>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico *</label>
                <input type="email" class="form-control" id="email" name="email" required>
                <small class="form-text text-muted">Campo obligatorio</small>
            </div>

            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="text" class="form-control" id="telefono" name="telefono">
            </div>

            <div class="mb-3">
                <label for="direccion" class="form-label">Dirección</label>
                <textarea class="form-control" id="direccion" name="direccion" rows="4" placeholder="Ingresa la dirección del cliente..."></textarea>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary btn-lg">
                    💾 Guardar Cliente
                </button>
                <a href="{{ url_for('clientes') }}" class="btn btn-secondary btn-lg">
                    ❌ Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
